name: KPI parity

# The Slack bot's membership numbers (agent routes) must equal the KPI dashboard's.
# Runs scripts/check-kpi-parity.ts against the production database (read-only role):
# on code changes, and nightly to catch edits to closed months.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]
  schedule:
    - cron: "0 13 * * *" # 5-6 AM Pacific
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Own setup instead of ./tooling/github/setup, which needs a .nvmrc the repo no longer has
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check agent numbers against the dashboard
        working-directory: apps/nextjs
        env:
          POSTGRES_URL: ${{ secrets.KPI_PARITY_POSTGRES_URL }}
        run: |
          if [ -z "$POSTGRES_URL" ]; then
            echo "::error::Secret KPI_PARITY_POSTGRES_URL is not set (read-only database URL). See scripts/check-kpi-parity.ts."
            exit 1
          fi
          npx tsx --tsconfig tsconfig.json scripts/check-kpi-parity.ts
